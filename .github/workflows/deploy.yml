# Build the image, push it to ECR, and roll the ECS service — on every push
# to main. This file replaces every command and click from Wednesday's
# Steps 7 and 8.
#
# Read the `permissions` block below before anything else. It is the most
# security-relevant part of the file and the part most tutorials skip.

name: Deploy to ECS

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  # Useful when a deploy failed for an environmental reason rather than a
  # code one.
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fieldnotes
  ECS_CLUSTER: fieldnotes-cluster
  ECS_SERVICE: fieldnotes-service
  CONTAINER_NAME: fieldnotes

jobs:
  deploy:
    runs-on: ubuntu-latest

    # THIS is what lets the job get AWS credentials without any being stored.
    # `id-token: write` allows GitHub to mint a short-lived OIDC token that
    # AWS trades for temporary credentials. The alternative -- an access key
    # in repository secrets -- is a permanent credential sitting in a system
    # you do not control, which nobody rotates and which survives the
    # departure of whoever created it.
    #
    # `contents: read` is stated explicitly rather than inherited. Declaring
    # the full permission set narrows the default, which is broader.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assume the deployment role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # An ARN, not a secret -- it is not sensitive. What makes this safe
          # is the role's TRUST POLICY, which names this specific repository
          # and branch. Stored as a variable purely to keep the file portable.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          # The commit SHA is the tag. Not "latest" -- `latest` is a name, not
          # a version: two different images can carry it hours apart, so a
          # rollback becomes "rebuild from an older commit and hope." A SHA
          # tag means every deployed image traces to exactly one commit, and
          # rolling back is redeploying a tag that already exists.
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

      - name: Put the new image into the task definition
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          # The checked-in task definition is the source of truth for
          # everything EXCEPT the image tag, which changes per commit. This
          # action swaps in the new URI and leaves the rest alone -- so CPU,
          # memory, environment variables and health checks are reviewed in
          # pull requests like any other code.
          task-definition: deploy/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to ECS and wait for it to stabilise
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Without this the job goes green the moment ECS ACCEPTS the
          # deployment -- not when it succeeds. A task that crash-loops on
          # startup would show as a successful deploy. Waiting turns the
          # pipeline's green tick into a claim about the running service
          # rather than about the API call.
          wait-for-service-stability: true
